<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Andrea Che">
  <title>Dungeon Loot System</title>
  <link rel="stylesheet" href="css/style.css">

</head>
<body>
  <header>
        <h1>Dungeon Loot System</h1>
        <p>Add loot items and calculate their total value. </p>
  </header>

  <main>
        <h2>Add Loot</h2>

        <label for="lootName">Loot Name:</label>
        <input type="text" id="lootName" name="lootName">

        <label for="lootValue">Loot Value:</label>
        <input type="number" id="lootValue" name="lootValue">

        <button type="button" id="addLootButton">Add Loot</button>

        <p id="validationMessage" role="status"></p>
        <h2>Loot Collected</h2>
        <ul id="lootList"></ul>

        <h2>Total Loot Value</h2>
        <p id="totalValue">0</p>
        </main>
  <script src="js/script.js" type="text/javascript"></script>
</body>
</html>
